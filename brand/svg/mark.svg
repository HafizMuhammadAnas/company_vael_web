<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VaelKode mark">
  <defs>
    <linearGradient id="vkStroke" x1="20%" y1="10%" x2="70%" y2="95%">
      <stop offset="0%" stop-color="#5ef0ff"/>
      <stop offset="35%" stop-color="#3aa7ff"/>
      <stop offset="68%" stop-color="#7b4dff"/>
      <stop offset="100%" stop-color="#c43dff"/>
    </linearGradient>
    <linearGradient id="vkInner" x1="40%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#9af7ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#4eb8ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8a4dff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vkGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#4ecbff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#6a3dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft bloom (optional; works best on dark) -->
  <ellipse cx="100" cy="112" rx="78" ry="70" fill="url(#vkGlow)"/>

  <!-- Simplified fluid V  approximates the ribbon mark for scalable UI use -->
  <g filter="url(#softGlow)">
    <path
      d="M42 48
         C 48 42, 58 46, 62 58
         L 88 148
         C 90 156, 98 160, 106 154
         L 168 58
         C 174 48, 168 38, 156 40
         C 148 42, 144 50, 140 58
         L 106 118
         C 102 126, 96 126, 92 118
         L 68 58
         C 62 46, 52 40, 42 48 Z"
      fill="url(#vkStroke)"
      opacity="0.92"
    />
    <path
      d="M58 56
         C 62 50, 70 54, 72 62
         L 92 130
         C 94 138, 100 140, 106 134
         L 148 62
         C 152 54, 148 46, 138 48
         C 132 50, 130 56, 128 62
         L 106 108
         C 103 116, 99 116, 96 108
         L 78 62
         C 74 52, 64 48, 58 56 Z"
      fill="url(#vkInner)"
    />
  </g>
</svg>
